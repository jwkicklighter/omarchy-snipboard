[package]
name = "snipboard"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Isolated search, storage, and template helper for the Snipboard Omarchy prototype"
publish = false

[dependencies]
caseless = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-general-category = "1"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
