name: Engine release

on:
  push:
    tags: ['engine-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Native test dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev xkb-data lua5.4 qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtqml-workerscript qml6-module-qtquick qml6-module-qtquick-window qml6-module-qtquick-layouts qml6-module-qtquick-controls qml6-module-qtquick-templates
      - name: Test and build candidate engine
        env:
          QT_QPA_PLATFORM: offscreen
          SNIPBOARD_REQUIRE_TEST_RUNNERS: '1'
        run: |
          echo /usr/lib/qt6/bin >> "$GITHUB_PATH"
          cargo test --release --locked
          cargo build --release --locked --bin snipboard-worker
      - name: Package immutable candidate and metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TAG_PUSH: ${{ github.event_name == 'push' }}
        run: |
          tag="$RELEASE_TAG"
          if [[ "$TAG_PUSH" != true ]]; then
            tag="engine-$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          fi
          python3 tools/engine_release.py package --tag "$tag"
          python3 tools/worker_smoke.py build/engine-dist/snipboard-worker-linux-x86_64
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine-linux-x86_64
          path: build/engine-dist/*
          if-no-files-found: error

  draft:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: engine-linux-x86_64
          path: dist
      - name: Create draft only; publication and pinning require review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > draft-state; then
            test "$(cat draft-state)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --latest=false --title "Engine ${RELEASE_TAG#engine-}" --notes "Independent Snipboard worker. Review candidate checksums and metadata before publishing; then adopt the pin in a separate UI PR."
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
