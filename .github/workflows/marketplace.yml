name: Retry marketplace update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published release tag (must point to current default-branch HEAD)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: marketplace-update
  cancel-in-progress: false

jobs:
  request:
    if: vars.MARKETPLACE_SUBMITTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Request marketplace update for an existing release
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/marketplace.py --tag "$RELEASE_TAG"
