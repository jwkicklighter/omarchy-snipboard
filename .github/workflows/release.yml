name: Release

# Bundle the worker in the release PR before enabling auto-merge. Publish the
# tagged draft only after checking and packaging that exact checked-in worker.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      pr_number: ${{ steps.pr.outputs.number }}
      pr_branch: ${{ steps.pr.outputs.branch }}
      pr_sha: ${{ steps.pr.outputs.sha }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Locate the release PR to bundle
        id: pr
        if: steps.release.outputs.release_created != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          number=""
          if [[ -n "$RELEASE_PR" ]]; then
            number=$(jq -r '.number // empty' <<<"$RELEASE_PR")
          fi
          if [[ -z "$number" ]]; then
            number=$(gh pr list --base master --head release-please--branches--master--components--snipboard --label 'autorelease: pending' --json number --jq '.[0].number // empty')
          fi
          if [[ -z "$number" ]]; then exit 0; fi
          pr=$(gh pr view "$number" --json headRefName,headRefOid,isCrossRepository,baseRefName)
          branch=$(jq -r .headRefName <<<"$pr")
          test "$branch" = release-please--branches--master--components--snipboard
          test "$(jq -r .isCrossRepository <<<"$pr")" = false
          test "$(jq -r .baseRefName <<<"$pr")" = master
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headRefOid <<<"$pr")" >> "$GITHUB_OUTPUT"

  bundle:
    needs: release
    if: needs.release.outputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # PR source executes only in this read-only job, never with the release PAT.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.pr_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build, bundle and smoke-test release PR worker
        run: |
          cargo build --release --locked --bin snipboard-worker
          python3 tools/bundle.py --write --worker build/release/snipboard-worker
          python3 tools/package.py --smoke-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundled-worker
          path: bin/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1

  update-release-pr:
    needs: [release, bundle]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.pr_sha }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundled-worker
          path: bin/linux-x86_64
      - name: Commit worker and enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ needs.release.outputs.pr_branch }}
          PR_NUMBER: ${{ needs.release.outputs.pr_number }}
        # Do not execute PR scripts or the downloaded binary in this write job.
        run: |
          chmod 755 bin/linux-x86_64/snipboard-worker
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- bin/linux-x86_64/snipboard-worker bin/linux-x86_64/worker.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: bundle release worker'
            git push origin "HEAD:refs/heads/$PR_BRANCH"
          fi
          gh pr merge --auto --squash --match-head-commit "$(git rev-parse HEAD)" "$PR_NUMBER"

  checks:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}

  publish:
    needs: [release, checks]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Check tag matches manifest, Cargo.toml and Cargo.lock
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 tools/package.py --check --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-x86_64
          path: build/dist
      - name: Publish GitHub release (safe to retry)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" build/dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  marketplace:
    needs: [release, publish]
    concurrency:
      group: marketplace-update
      cancel-in-progress: false
    # Enable only after the initial marketplace listing has been approved.
    if: vars.MARKETPLACE_SUBMITTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Request exact-commit marketplace update
        env:
          # The repository GITHUB_TOKEN cannot open issues in another repository.
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 tools/marketplace.py --tag "$RELEASE_TAG"
