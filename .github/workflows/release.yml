name: Plugin release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  checks:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.tag_name }}

  publish:
    needs: [release, checks]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Check plugin tag (engine version is independent)
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 tools/package.py --check --tag "$RELEASE_TAG"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-x86_64
          path: build/dist
      - name: Publish plugin assets after pinned-worker integration passes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" build/dist/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false

  marketplace:
    needs: [release, publish]
    concurrency:
      group: marketplace-update
      cancel-in-progress: false
    if: vars.MARKETPLACE_SUBMITTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}
      - name: Request exact-commit marketplace update
        env:
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag_name }}
        run: python3 tools/marketplace.py --tag "$RELEASE_TAG"
