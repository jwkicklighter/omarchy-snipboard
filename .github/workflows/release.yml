name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tag matches manifest, Cargo.toml and Cargo.lock
        run: python3 tools/package.py --check --tag "$GITHUB_REF_NAME"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-linux-x86_64
          path: build/dist
      - name: Publish GitHub release (safe to retry)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Snipboard $GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" build/dist/* --clobber

  marketplace:
    needs: publish
    concurrency:
      group: marketplace-update
      cancel-in-progress: false
    # Enable only after the initial marketplace listing has been approved.
    if: vars.MARKETPLACE_SUBMITTED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Request exact-commit marketplace update
        env:
          # The repository GITHUB_TOKEN cannot open issues in another repository.
          GH_TOKEN: ${{ secrets.MARKETPLACE_TOKEN }}
        run: python3 tools/marketplace.py --tag "$GITHUB_REF_NAME"
